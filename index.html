<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 热点日报</title>
<style>
  :root {
    --bg: #0b0f1a;
    --panel: #131a2b;
    --panel-2: #1a2338;
    --border: #26314d;
    --text: #e8ecf5;
    --muted: #8a94ab;
    --accent: #5b8cff;
    --accent-2: #8b5cf6;
    --hot: #ff6b6b;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(139, 92, 246, .14), transparent 60%),
      radial-gradient(900px 400px at 10% -10%, rgba(91, 140, 255, .14), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 28px 18px 60px; }

  header { margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 46px; height: 46px; border-radius: 12px; font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 24px rgba(91, 140, 255, .35);
  }
  h1 { font-size: 24px; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* 日期导航 */
  .navbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 14px; margin-bottom: 20px;
  }
  .navbar button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px;
  }
  .navbar button:hover { border-color: var(--accent); }
  select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 14px; flex: 1; min-width: 140px;
  }
  .meta { color: var(--muted); font-size: 12px; margin-left: auto; }

  /* 日报文案卡 */
  .report-card {
    background: linear-gradient(180deg, rgba(91,140,255,.10), rgba(139,92,246,.06)), var(--panel);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; margin-bottom: 24px;
  }
  .report-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .report-head h2 { font-size: 16px; }
  .copy-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border: none; border-radius: 8px; padding: 7px 16px;
    cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  .copy-btn:hover { filter: brightness(1.12); }
  .report-text {
    white-space: pre-wrap; word-break: break-word; color: #d7deee;
    font-size: 14px; max-height: 340px; overflow-y: auto;
    padding: 14px; background: rgba(0,0,0,.25); border-radius: 10px;
  }

  /* 热点卡片 */
  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px;
    transition: border-color .15s;
  }
  .card:hover { border-color: #3b4a75; }
  .card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hot {
    font-size: 12px; font-weight: 700; color: #fff; padding: 2px 9px; border-radius: 99px;
    background: linear-gradient(135deg, #ff6b6b, #ff9f43);
  }
  .hot.h1,.hot.h2 { background: #3b4a75; }
  .hot.h3 { background: linear-gradient(135deg, #5b8cff, #47b5ff); }
  .chip {
    font-size: 12px; color: var(--muted); border: 1px solid var(--border);
    padding: 2px 9px; border-radius: 99px;
  }
  .card a.title {
    color: var(--text); text-decoration: none; font-size: 16px; font-weight: 600; line-height: 1.45;
  }
  .card a.title:hover { color: var(--accent); }
  .card a.title:visited { color: #c3c9da; }
  .summary { color: var(--muted); font-size: 13.5px; flex: 1; }
  .card-foot { display: flex; gap: 8px; }
  .mini-btn {
    flex: 1; text-align: center; text-decoration: none; cursor: pointer;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 0; font-size: 13px;
  }
  .mini-btn:hover { border-color: var(--accent); }
  .mini-btn.primary { background: rgba(91,140,255,.15); border-color: rgba(91,140,255,.4); }

  /* 状态 */
  .status { text-align: center; color: var(--muted); padding: 60px 0; }
  .err { color: #ff8484; font-size: 14px; white-space: pre-wrap; }

  #toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    background: #22c17b; color: #04150c; font-weight: 600; font-size: 14px;
    padding: 9px 20px; border-radius: 99px; opacity: 0; pointer-events: none;
    transition: all .25s; box-shadow: 0 8px 30px rgba(34,193,123,.4);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">🤖</div>
      <div>
        <h1>AI 热点日报</h1>
        <div class="sub">每天自动抓取全网 AI 热点 · 一键复制发社媒</div>
      </div>
    </div>
  </header>

  <div class="navbar">
    <button id="prev">‹ 前一天</button>
    <select id="dateSelect"></select>
    <button id="next">后一天 ›</button>
    <span class="meta" id="meta"></span>
  </div>

  <div id="content"><div class="status">加载中…</div></div>

  <footer>Powered by GitHub Actions · 数据每日北京时间早上自动更新</footer>
</div>
<div id="toast">已复制 ✓</div>

<script>
const $ = (s) => document.querySelector(s);
let days = [];

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg || "已复制 ✓";
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); return true; }
    finally { ta.remove(); }
  }
}

function itemShareText(it) {
  const marks = ["", "•", "•", "🔥", "🔥", "🔥🔥"];
  const mark = marks[it.hot] || "•";
  const tags = "#AI日报 #人工智能";
  return `${mark} ${it.title}\n${it.summary}\n原文：${it.url}\n\n${tags}`;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

function render(data) {
  const items = data.items || [];
  let html = "";

  if (data.report_text) {
    html += `
      <div class="report-card">
        <div class="report-head">
          <h2>📝 今日日报文案（发微博 / 小红书 / 朋友圈）</h2>
          <button class="copy-btn" id="copyReport">📋 一键复制全文</button>
        </div>
        <div class="report-text">${esc(data.report_text)}</div>
      </div>`;
  }

  if (!items.length) {
    html += `<div class="status">这一天没有数据</div>`;
  } else {
    html += `<div class="grid">` + items.map((it, i) => `
      <div class="card">
        <div class="card-top">
          <span class="hot h${it.hot || 3}">🔥 热度 ${it.hot || 3}</span>
          <span class="chip">${esc(it.source)}</span>
        </div>
        <a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
        <div class="summary">${esc(it.summary) || "（暂无摘要）"}</div>
        <div class="card-foot">
          <a class="mini-btn" href="${esc(it.url)}" target="_blank" rel="noopener">🔗 原文</a>
          <button class="mini-btn primary" data-copy="${i}">📋 复制文案</button>
        </div>
      </div>`).join("") + `</div>`;
  }

  $("#content").innerHTML = html;
  $("#meta").textContent = `精选 ${items.length} 条 · 更新于 ${data.generated_at || "—"} · ${data.llm ? (data.llm.provider + "/" + data.llm.model) : ""}`;

  const btn = $("#copyReport");
  if (btn) btn.onclick = async () => {
    if (await copyText(data.report_text)) toast("日报全文已复制 ✓");
  };
  document.querySelectorAll("[data-copy]").forEach(b => {
    b.onclick = async () => {
      const it = items[+b.dataset.copy];
      if (it && await copyText(itemShareText(it))) toast("已复制，去粘贴吧 ✓");
    };
  });
}

async function loadDay(date) {
  $("#content").innerHTML = `<div class="status">加载中…</div>`;
  try {
    const resp = await fetch(`data/${date}.json`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    render(await resp.json());
    localStorage.setItem("aidaily:date", date);
  } catch (e) {
    $("#content").innerHTML = `<div class="status err">加载失败：${esc(e.message)}
若直接双击打开本文件会出现这种情况，请用本地服务器访问（如 http://localhost:8137）或线上网址。</div>`;
  }
}

function initNav(selected) {
  const sel = $("#dateSelect");
  sel.innerHTML = days.map(d =>
    `<option value="${d.date}" ${d.date === selected ? "selected" : ""}>${d.date}（${d.count} 条）</option>`).join("");
  sel.onchange = () => loadDay(sel.value);

  const idx = days.findIndex(d => d.date === selected);
  $("#prev").onclick = () => { if (idx + 1 < days.length) loadDay(days[idx + 1].date); };
  $("#next").onclick = () => { if (idx - 1 >= 0) loadDay(days[idx - 1].date); };
}

(async function init() {
  try {
    const resp = await fetch("data/manifest.json");
    const manifest = await resp.json();
    days = manifest.days || [];
    if (!days.length) throw new Error("归档为空");
    const last = localStorage.getItem("aidaily:date");
    const target = days.some(d => d.date === last) ? last : days[0].date;
    initNav(target);
    loadDay(target);
  } catch (e) {
    $("#content").innerHTML = `<div class="status err">manifest 加载失败：${esc(e.message)}<br>请通过 http:// 访问本站（本地可用 启动本地预览.bat）。</div>`;
  }
})();
</script>
</body>
</html>
